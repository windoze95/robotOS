name: Container checks and images
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Container integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deployment tests
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Build hub and Hermes adapter images
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -f deploy/hub/Dockerfile -t robotos-hub:test .
          docker build --build-arg VCS_REF="$GITHUB_SHA" -f deploy/hermes/Dockerfile -t robotos-hermes:test .
      - name: Verify containers, persistence and split-service integration
        run: python3 deploy/tests/container_smoke.py --image robotos-hub:test --hermes-image robotos-hermes:test
      - name: Verify k3s manifests and persistent rollout in a disposable cluster
        run: python3 deploy/tests/k3s_smoke.py --image robotos-hub:test --hermes-image robotos-hermes:test
  publish:
    name: Publish ${{ matrix.image }} (amd64 and arm64)
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [hub, hermes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/robotos-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=robotos-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=robotos-${{ matrix.image }}
