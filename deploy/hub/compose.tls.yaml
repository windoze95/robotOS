# Optional public-DNS ACME proxy. Omit when using Tailscale Serve or another proxy.
services:
  tls:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      ROBOTOS_HOSTNAME: ${ROBOTOS_HOSTNAME:?Set the DNS name used in ROBOTOS_PUBLIC_ORIGIN}
    ports:
      - '${ROBOTOS_INGRESS_BIND:-0.0.0.0}:80:8080'
      - '${ROBOTOS_INGRESS_BIND:-0.0.0.0}:443:8443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
volumes:
  tls-data:
  tls-config:
